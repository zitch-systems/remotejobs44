<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RemoteJobs44 — Landing · Mobile View</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#0b1220;
    color:#cbd5e1;
    font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:28px 16px 40px;
    background-image:radial-gradient(ellipse 60% 40% at 50% 0%, rgba(37,99,235,0.18), transparent 60%);
  }
  .head{ text-align:center; margin-bottom:22px; }
  .head h1{ font-family:'Sora',system-ui,sans-serif; font-weight:700; font-size:18px; color:#f1f5f9; margin:0 0 6px; letter-spacing:-0.01em; }
  .head p{ margin:0; font-size:13px; color:#7c8aa3; }
  .head code{ font-family:ui-monospace,Menlo,monospace; font-size:12px; color:#93b4ff; }

  .phone{
    position:relative;
    width:390px; height:844px;
    background:#000; border-radius:52px; padding:11px;
    box-shadow:0 0 0 2px #1c2536, 0 30px 70px -20px rgba(0,0,0,0.8);
    flex-shrink:0;
  }
  .screen{
    position:relative; width:100%; height:100%;
    border-radius:42px; overflow:hidden; background:#f8faff;
  }
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:128px; height:30px; background:#000;
    border-bottom-left-radius:16px; border-bottom-right-radius:16px;
    z-index:10; pointer-events:none;
  }
  iframe{ width:390px; height:844px; border:0; display:block; }

  .controls{ display:flex; gap:10px; margin-top:22px; }
  .controls button{
    font-family:inherit; font-size:13px; font-weight:600;
    color:#cbd5e1; background:#161f33; border:1px solid #243353;
    padding:9px 16px; border-radius:10px; cursor:pointer;
  }
  .controls button:hover{ background:#1d2942; color:#fff; }
  .hint{ margin-top:14px; font-size:12px; color:#5f6e88; max-width:380px; text-align:center; line-height:1.5; }
</style>
</head>
<body>
  <div class="head">
    <h1>RemoteJobs44 — Landing · Mobile view</h1>
    <p>Live render of <code>RemoteJobs44-Landing.html</code> at a 390&nbsp;px viewport</p>
  </div>

  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <iframe id="frame" src="RemoteJobs44-Landing.html" title="RemoteJobs44 landing mobile"></iframe>
    </div>
  </div>

  <div class="controls">
    <button id="theme">Toggle dark mode</button>
    <button id="top">Scroll to top</button>
  </div>
  <p class="hint">The frame is a real 390&nbsp;px viewport, so the production <code>deep-ocean.css</code> breakpoints (960 / 720 / 560 / 520) and the <code>md</code> (768&nbsp;px) header→hamburger + bottom-nav swap all fire exactly as on a phone.</p>

  <script>
    const frame=document.getElementById('frame');
    document.getElementById('theme').addEventListener('click',()=>{
      try{ frame.contentWindow.document.getElementById('mkTheme').click(); }catch(e){}
    });
    document.getElementById('top').addEventListener('click',()=>{
      try{ frame.contentWindow.scrollTo({top:0,behavior:'smooth'}); }catch(e){}
    });
  </script>
</body>
</html>
