<div style="font-family:Arial,sans-serif;max-width:560px;margin:0 auto;padding:24px;color:#1c1917;">
  <div style="background-color:#2563eb;padding:24px;text-align:center;border-radius:8px 8px 0 0;">
    <img src="https://remotejobs44.com/icons/icon-192.png" alt="RemoteJobs44" width="48" height="48" style="border-radius:8px;">
    <h1 style="color:#ffffff;font-size:22px;margin:12px 0 4px;">RemoteJobs44</h1>
    <p style="color:#dbeafe;font-size:14px;margin:0;">Confirm your email address</p>
  </div>
  <div style="background-color:#ffffff;padding:32px 24px;border:1px solid #e7e5e4;border-top:none;border-radius:0 0 8px 8px;">
    <h2 style="margin:0 0 16px;font-size:20px;">Welcome aboard!</h2>
    <p style="margin:0 0 24px;color:#57534e;line-height:1.6;">
      Tap the button below to confirm <b>{{ .Email }}</b> and finish creating your account.
    </p>
    <p style="margin:0 0 24px;text-align:center;">
      <a href="{{ .ConfirmationURL }}" style="background-color:#2563eb;color:#ffffff;text-decoration:none;padding:14px 32px;border-radius:8px;font-weight:bold;display:inline-block;">Confirm Email Address</a>
    </p>
    <p style="margin:0 0 24px;color:#78716c;font-size:13px;line-height:1.6;">
      Or copy this link into your browser:<br>
      <a href="{{ .ConfirmationURL }}" style="color:#2563eb;word-break:break-all;">{{ .ConfirmationURL }}</a>
    </p>
    <hr style="border:none;border-top:1px solid #e7e5e4;margin:24px 0;">
    <p style="margin:0;color:#a8a29e;font-size:13px;">
      If you did not sign up for RemoteJobs44, you can safely ignore this email.
    </p>
  </div>
</div>
