name: CI

# Path-filtered so a change only spends minutes on the checks it can affect:
# web changes (anything outside mobile/) run this workflow; mobile/** changes
# run ci-mobile.yml instead. Stops every mobile-only PR from paying for the
# slow Next.js build, and every web PR from running the Expo checks.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'mobile/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'mobile/**'

# Cancel older runs on the same branch when a new push lands. Saves
# CI minutes when a contributor pushes a fix on top of a still-running
# build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: type-check · lint · unit tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Match the Node 24 runtime configured by the Vercel project and
          # required by the current Chromium/Puppeteer dependencies.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        # `--max-warnings 0` would force the existing react-hooks /
        # entity-escape warnings to block CI. Until those are cleaned
        # up we run lint without that flag so it surfaces them as
        # informational output without failing the build.
        run: npm run lint

      - name: Unit tests + coverage
        # --coverage writes lcov + html into ./coverage. We keep
        # test:unit cheap for local dev (no coverage overhead) and only
        # ask for the report in CI. The HTML artefact uploaded below is
        # what reviewers download from a PR run to see uncovered lines
        # without running anything locally.
        run: npm run test:unit -- --coverage

      - name: Archive coverage report
        # always(): run even when tests failed, so the failing PR's
        # report is still inspectable. Retention is short by design —
        # CI artefacts on a public repo can be downloaded by anyone, so
        # we don't want a year of internal coverage reports lying
        # around. 14d is enough to investigate a regression spotted
        # late in review.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          retention-days: 14
          if-no-files-found: ignore

      # Build last — it's the slowest step and only matters if the
      # cheaper checks above pass.
      - name: Build (Next.js)
        env:
          # The build calls into app/api/* metadata generators which
          # try to read Supabase env vars. Provide harmless placeholders
          # so the build doesn't fail on missing env. Real values live
          # in Vercel's project settings for production.
          NEXT_PUBLIC_SUPABASE_URL:      'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-placeholder-anon-key'
          SUPABASE_SERVICE_ROLE_KEY:     'ci-placeholder-service-role-key'
          NEXT_PUBLIC_APP_URL:           'https://remotejobs44.com'
          PAYSTACK_SECRET_KEY:           'ci-placeholder-paystack-secret'
          CRON_SECRET:                   'ci-placeholder-cron-secret-min-16-chars'
        run: npm run build

  # End-to-end smoke suite (hardening: the Playwright suite existed but never
  # ran in CI — docs/TECHNICAL_DEBT.md High #3). Chromium-only for speed.
  # Env-dependent tests are excluded because CI has no Supabase secrets.
  # The suite covers auth/pricing/SEO plus jobs interactions and a 320px
  # overflow/touch-target regression check.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start server and run e2e
        run: |
          npm run start & 
          npx wait-on -t 60000 http://localhost:3000
          BASE_URL=http://localhost:3000 npx playwright test \
            tests/e2e/seo.spec.ts tests/e2e/pricing.spec.ts tests/e2e/auth.spec.ts \
            tests/e2e/jobs.spec.ts tests/e2e/mobile-audit.spec.ts \
            --project=chromium \
            --grep-invert "wrong credentials|validates empty fields|plan comparison|sitemap.xml is accessible"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
