name: Android APK Release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-apk-release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Load public preview configuration
        run: |
          node scripts/release-preflight.mjs --eas-profile preview
          node -e 'const fs=require("fs"); const env=require("./eas.json").build.preview.env; for (const [k,v] of Object.entries(env)) { if (!k.startsWith("EXPO_PUBLIC_") || /[\r\n]/.test(v)) throw Error("Invalid public build environment"); fs.appendFileSync(process.env.GITHUB_ENV,k+"="+v+"\n"); }'
      - name: Install and validate mobile app
        run: |
          npm ci
          npx tsc --noEmit
          npm test
      - name: Configure separately installable preview
        run: |
          node -e 'const fs=require("fs"); const p="app.json"; const c=JSON.parse(fs.readFileSync(p)); c.expo.name="RemoteJobs44 Preview"; c.expo.android.package="com.remotejobs44.app.preview"; c.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER); fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n");'
          npx expo prebuild --platform android --clean --no-install
      - uses: gradle/actions/setup-gradle@v6
      - name: Build standalone phone APK
        run: ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        working-directory: mobile/android
      - name: Verify APK signature and phone architectures
        working-directory: .
        run: |
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > apk-metadata.txt
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path("mobile/android/app/build/outputs/apk/release/app-release.apk")
          names = ZipFile(apk).namelist()
          assert any(name.startswith("lib/arm64-v8a/") for name in names), "ARM64 libraries missing"
          assert any(name.startswith("lib/armeabi-v7a/") for name in names), "ARMv7 libraries missing"
          assert "name='com.remotejobs44.app.preview'" in Path("apk-metadata.txt").read_text()
          PY
          cp "$APK" RemoteJobs44-Android-Preview.apk
          sha256sum RemoteJobs44-Android-Preview.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: remotejobs44-installable-preview
          path: |
            RemoteJobs44-Android-Preview.apk
            SHA256SUMS.txt
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: remotejobs44-installable-preview
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN: ${{ github.run_number }}
        run: |
          cat > release-notes.md <<'NOTES'
          Installable Android preview connected to the live RemoteJobs44 backend.
          
          Download **RemoteJobs44-Android-Preview.apk** below and open it on your Android phone. ZIP source archives are not needed.
          
          This is a preview for testing, signed with the Android development certificate and installed separately as RemoteJobs44 Preview. It is not the Play Store production release. Real account actions and payments use the live platform.
          
          Mobile type checks and unit tests passed; the APK signature and ARM64/ARMv7 libraries were verified. Physical-device testing remains to be completed.
          NOTES
          gh release create "android-preview-$RELEASE_RUN" RemoteJobs44-Android-Preview.apk SHA256SUMS.txt --repo "$GH_REPO" --target "$RELEASE_SHA" --title "RemoteJobs44 Android Preview" --notes-file release-notes.md --prerelease
