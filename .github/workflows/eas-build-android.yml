# EAS Build — Android install/store artifact (on demand).
#
# This is what makes "trigger from GitHub → get an Android artifact" work. It does NOT run
# on every push (EAS build minutes are limited); trigger it either by clicking
# "Run workflow" on the Actions tab, or by pushing a tag like `mobile-v1`.
#
# PREREQUISITES (one-time, only you can do these — see mobile/BUILD.md):
#   1. Add an Expo access token as the repo secret EXPO_TOKEN
#      (Expo dashboard → Account/Org → Access tokens → create → copy into
#       GitHub repo Settings → Secrets and variables → Actions).
#   2. Link the project: run `eas init` in mobile/ once (writes owner +
#      extra.eas.projectId into app.json) and commit it — otherwise the build
#      can't resolve the EAS project in --non-interactive mode.
#   3. Keep the selected eas.json profile's public backend environment complete;
#      release-preflight.mjs rejects blank, placeholder, or privileged keys.
name: EAS Build (Android)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        default: preview
        options: [preview, production]
  push:
    tags:
      - "mobile-v*"

jobs:
  android:
    name: Build Android ${{ github.event.inputs.profile || 'preview' }} artifact
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: npm ci

      - name: Validate selected release profile
        env:
          EAS_PROFILE: ${{ github.event.inputs.profile || 'preview' }}
        run: node scripts/release-preflight.mjs --eas-profile "$EAS_PROFILE"

      - name: Build Android artifact and wait for completion
        # preview produces an installable APK; production produces a Play AAB.
        # Waiting makes this job's result reflect the remote EAS build result.
        run: eas build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive
