name: Security

# Defence-in-depth scanning that complements the functional CI in ci.yml:
#   - dependency-review : blocks PRs that introduce known-vulnerable or
#                         disallowed-license dependencies (supply chain).
#   - npm-audit         : fails on a high/critical advisory in the lockfile.
#   - codeql            : static analysis for injection / XSS / auth bugs in
#                         the app + API route handlers.
on:
  push:
    branches: [main]
    # Mobile-only changes can't affect the root lockfile this job audits, so
    # skip them here — the weekly schedule below still re-audits everything.
    paths-ignore:
      - 'mobile/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'mobile/**'
  schedule:
    # Weekly catch for advisories disclosed after a PR already merged.
    - cron: "27 6 * * 1"

# Least-privilege default: jobs opt into exactly what they need.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review (PR)
    # PR-only, and only where it can actually run: dependency-review-action
    # (like CodeQL) needs the Dependency Graph + GitHub Advanced Security,
    # which on a PRIVATE repo requires a GHAS licence. Gating on
    # repository.visibility makes the job SKIP (neutral, not red) on private
    # repos and light up automatically if the repo goes public or GHAS is
    # enabled. The always-on `npm audit` job below is the gate that runs
    # everywhere. See docs/SECURITY_SEO_AUDIT_2026.md.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # Reject copyleft/network licenses that would contaminate a
          # proprietary SaaS codebase. Adjust to taste.
          deny-licenses: AGPL-3.0, LGPL-3.0, GPL-3.0

  npm-audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install (offline, from lockfile)
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        # --omit=dev keeps dev-only advisories from blocking a deploy while
        # still failing on anything that ships to users. Dependabot opens the
        # remediation PRs surfaced here.
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL (javascript-typescript)
    # CodeQL uploads to code scanning, which needs GitHub Advanced Security on
    # private repos. Skip cleanly where unavailable (see dependency-review note
    # above); runs automatically on public repos or once GHAS is enabled.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Analyze
        uses: github/codeql-action/analyze@v4
