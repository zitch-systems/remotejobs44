# codemagic.yaml — CI builds for the RemoteJobs44 Expo app (in ./mobile).
#
# This is a managed Expo app: android/ and ios/ are gitignored and generated by
# `expo prebuild` (Continuous Native Generation), so every build regenerates the
# native project, then builds with Gradle. EXPO_PUBLIC_* env vars are inlined at
# bundle time, so they MUST be present during the Gradle build.
#
# ── One-time setup in the Codemagic UI ─────────────────────────────────────────
# 1. Connect the GitHub repo (zitch-systems/remotejobs44).
# 2. Code signing → Android keystores → upload a keystore with reference name
#    `remotejobs44_keystore`. To keep the SAME signature as the EAS builds (so
#    existing installs update in place) download the EAS keystore first:
#       cd mobile && npx eas-cli credentials   # Android → Keystore → Download
#    Otherwise `keytool -genkey -v -keystore remotejobs44.jks -alias upload \
#       -keyalg RSA -keysize 2048 -validity 10000` (fresh signature → reinstall).
# 3. Environment variables → group `expo_public` (mark Secure):
#       EXPO_PUBLIC_SUPABASE_URL       = https://gnyilmahiyddplsrrhoq.supabase.co
#       EXPO_PUBLIC_SUPABASE_ANON_KEY  = <your anon key>
#       # optional: EXPO_PUBLIC_SENTRY_DSN
# ───────────────────────────────────────────────────────────────────────────────

definitions:
  env_versions: &env_versions
    node: 22         # Expo SDK 56 requires Node >= 20.19.4; use current 22 LTS
    java: 17
  base_scripts:
    install: &install
      name: Install JS dependencies
      script: npm ci
    set_version: &set_version
      name: Stamp native build number from the CI build number
      script: |
        # Google Play AND the App Store both REJECT a duplicate build number, so
        # every upload must use a higher one. CNG regenerates android/ + ios/
        # from app.json on each prebuild, so stamp both app.json's
        # android.versionCode (int) and ios.buildNumber (string) with
        # Codemagic's monotonic build number BEFORE prebuild runs. versionName
        # / CFBundleShortVersionString ("1.0.0") is unchanged — only the build
        # number needs to be unique.
        node -e "const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));const n=parseInt(process.env.PROJECT_BUILD_NUMBER||process.env.BUILD_NUMBER||'1',10);j.expo.android=j.expo.android||{};j.expo.ios=j.expo.ios||{};j.expo.android.versionCode=n;j.expo.ios.buildNumber=String(n);fs.writeFileSync(p,JSON.stringify(j,null,2));console.log('versionCode/buildNumber =',n);"
    prebuild: &prebuild
      name: Expo prebuild (Android)
      script: npx expo prebuild --platform android --clean
    prebuild_ios: &prebuild_ios
      name: Expo prebuild (iOS)
      script: npx expo prebuild --platform ios --clean

workflows:
  android-apk:
    name: RemoteJobs44 · Android APK (internal / sideload)
    instance_type: mac_mini_m1
    max_build_duration: 60
    working_directory: mobile
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    environment:
      <<: *env_versions
      groups:
        - expo_public        # EXPO_PUBLIC_SUPABASE_URL / _ANON_KEY (Codemagic UI)
      android_signing:
        - remotejobs44_keystore
      vars:
        PACKAGE_NAME: com.remotejobs44.app
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
    scripts:
      - *install
      - *set_version
      - *prebuild
      - name: Build signed release APK
        script: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
    artifacts:
      # Match regardless of whether globs resolve from the repo root or the
      # workflow's working_directory (mobile/).
      - android/app/build/outputs/**/*.apk
      - mobile/android/app/build/outputs/**/*.apk
      - '**/*.apk'
    publishing:
      email:
        recipients:
          - teyokensax1@gmail.com
        notify:
          success: true
          failure: true

  android-aab:
    name: RemoteJobs44 · Android AAB (Play Store)
    instance_type: mac_mini_m1
    max_build_duration: 60
    working_directory: mobile
    environment:
      <<: *env_versions
      groups:
        - expo_public
      android_signing:
        - remotejobs44_keystore
      vars:
        PACKAGE_NAME: com.remotejobs44.app
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
    scripts:
      - *install
      - *set_version
      - *prebuild
      - name: Build signed release AAB
        script: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
    artifacts:
      - android/app/build/outputs/**/*.aab
      - mobile/android/app/build/outputs/**/*.aab
      - '**/*.aab'
    publishing:
      email:
        recipients:
          - teyokensax1@gmail.com
        notify:
          success: true
          failure: true
      # ── Auto-publish to Google Play (optional — leave commented until ready) ──
      # Prerequisites (one-time):
      #   1. Create the app in Play Console and upload the FIRST .aab MANUALLY
      #      (Google requires the first upload via the console so you can opt
      #      into Play App Signing). Only automate from the 2nd release on.
      #   2. Create a Google Cloud service account, grant it access in Play
      #      Console → Users & permissions (Release apps to testing tracks),
      #      and download its JSON key.
      #   3. Add that JSON as a SECURE Codemagic env var named
      #      GCLOUD_SERVICE_ACCOUNT_CREDENTIALS.
      # Then uncomment:
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal          # internal → closed (alpha/beta) → production
      #   submit_as_draft: true    # review in the console before going live
      #   in_app_update_priority: 0

  # ── iOS (App Store / TestFlight) ───────────────────────────────────────────────
  # Manual-trigger (no `triggering:` block) — iOS build minutes on macOS are
  # pricier, so kick this from the Codemagic UI for a release.
  #
  # PREREQUISITES (one-time — only you can do these, all Apple-side):
  #   1. Apple Developer Program membership ($99/yr).
  #   2. App Store Connect API key: Codemagic → Teams → Integrations →
  #      App Store Connect → connect a key (Issuer ID + Key ID + .p8). Name the
  #      integration `codemagic_asc_api_key` (or edit the name below).
  #   3. Register the bundle id `com.remotejobs44.app` in your Apple Developer
  #      account (or let the ASC integration auto-create it on first run).
  #   4. Create the app in App Store Connect (reuse the same bundle id).
  #   5. Same `expo_public` env group as Android (Supabase URL / anon key).
  #
  # Signing is automatic: `xcode-project use-profiles` fetches the cert +
  # provisioning profile from the App Store Connect integration at build time —
  # no certificates committed to the repo.
  ios-ipa:
    name: RemoteJobs44 · iOS IPA (App Store / TestFlight)
    instance_type: mac_mini_m1
    max_build_duration: 60
    working_directory: mobile
    integrations:
      app_store_connect: codemagic_asc_api_key
    environment:
      <<: *env_versions
      groups:
        - expo_public        # EXPO_PUBLIC_SUPABASE_URL / _ANON_KEY (Codemagic UI)
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.remotejobs44.app
      vars:
        BUNDLE_ID: com.remotejobs44.app
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - *install
      - *set_version
      - *prebuild_ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Set up provisioning profiles (App Store Connect)
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "ios/RemoteJobs44.xcodeproj" \
            --scheme "RemoteJobs44"
    artifacts:
      - build/ios/ipa/*.ipa
      - mobile/build/ios/ipa/*.ipa
      - '**/*.ipa'
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - teyokensax1@gmail.com
        notify:
          success: true
          failure: true
      # ── Auto-publish to TestFlight (optional — leave commented until ready) ──
      # After the app exists in App Store Connect, uncomment to push every
      # build straight to TestFlight (uses the same ASC integration above):
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
